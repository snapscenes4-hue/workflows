name: Trading Bot - NYSE Open Trigger

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger-trading-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "anthropic>=0.92.0"

      - name: Debug environment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -c "import anthropic; print('SDK version:', anthropic.__version__)"
          python -c "import os; key=os.environ.get('ANTHROPIC_API_KEY','NOT SET'); print('Key set:', key != 'NOT SET', '| Length:', len(key) if key != 'NOT SET' else 0)"

      - name: Run Trading Session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUESTRADE_REFRESH_TOKEN: ${{ secrets.QUESTRADE_REFRESH_TOKEN }}
        run: python trading_trigger.py 2>&1
